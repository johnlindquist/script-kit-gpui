# Cargo configuration for script-kit-gpui
#
# Keep local `cargo test` parallel by default for faster iteration.
# Use `cargo test-serial` only when diagnosing teardown races.

[alias]
test-serial = "test -- --test-threads=1"

[target.'cfg(target_os = "macos")']
linker = "clang"
rustflags = [
  "-C",
  "split-debuginfo=unpacked",
  "-C",
  "link-arg=-Wl,-dead_strip",
]

[env]
# Do not force CARGO_INCREMENTAL=1 globally: sccache rejects that environment
# before rustc can run. Profile settings retain fast local workspace rebuilds,
# while normal external dependencies remain eligible for compiler caching.
CARGO_PROFILE_DEV_INCREMENTAL = "true"
CARGO_PROFILE_TEST_INCREMENTAL = "true"

[future-incompat-report]
frequency = "never"
